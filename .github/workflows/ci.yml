# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test, Build and Validate

# El workflow se ejecuta al publicar cambios en las ramas principales del
# desarrollo y al abrir o actualizar una solicitud de integración hacia main.
on:
  push:
    branches: [ "main", "ci-pipeline" ]
  pull_request:
    branches: [ "main" ]

permissions:
  # Permiso mínimo: solo se necesita leer el contenido del repositorio.
  contents: read

jobs:
  test_and_build:
    # Entorno limpio que simula una computadora Linux para todas las pruebas.
    runs-on: ubuntu-latest

    steps:
    # Descarga el contenido exacto del commit que originó la ejecución.
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi

    # pytest descubre automáticamente los archivos test_*.py dentro de la carpeta.
    - name: Test with pytest
      run: python -m pytest backend/tests

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json


    - name: Check linting
      working-directory: backend
      run: |
        ruff check .

    # npm ci instala exactamente las versiones registradas en package-lock.json.
    - name: Install frontend dependencies
      run: npm ci --prefix frontend

    # tsc valida los tipos y Vite genera el paquete de producción.
    - name: Build frontend
      run: npm run build --prefix frontend
